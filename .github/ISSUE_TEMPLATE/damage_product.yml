# Written by agent-recon (agent_recon/publish/comments.py); the deploy copies it to Milillo-lab/panama-2026-recon/.github/ISSUE_TEMPLATE/.
name: Suggest or contribute a damage product / Sugerir o aportar un producto de danos
description: A damage map or grading, with its URL, licence, producer, valid area, date and method / Un mapa o clasificacion de danos
title: '[Damage product] '
labels:
- damage_product
body:
- type: markdown
  attributes:
    value: |-
      **English.** Offer or suggest data for [the mission site](https://milillo-lab.github.io/panama-2026-recon/). Nothing you write is downloaded, run or published by itself: a person on the team checks the licence, the area it covers and the file before anything is used, and answers here. This is a research product, not for emergency use.

      **Espanol.** Ofrezca o sugiera datos para [el sitio de la mision](https://milillo-lab.github.io/panama-2026-recon/). Nada de lo que escriba se descarga, ejecuta ni publica automaticamente: una persona del equipo revisa la licencia, el area y el archivo antes de usar nada, y responde aqui. Es un producto de investigacion, no para uso en emergencias.

      **Everything you write here is public. / Todo lo que escriba aqui es publico.** Leave out personal data (names, faces, phone numbers, addresses). / No incluya datos personales. Do not paste passwords or private links. / No pegue contrasenas ni enlaces privados.
- type: input
  id: p_name
  attributes:
    label: Product name / Nombre del producto
    description: As the producer calls it. / Como lo llama el productor.
  validations:
    required: true
- type: textarea
  id: c_what
  attributes:
    label: What is it / Que es
    description: What you offer or suggest, in a few lines. / Que ofrece o sugiere, en pocas lineas.
  validations:
    required: true
- type: input
  id: c_obtain
  attributes:
    label: 'How to obtain it (link, or write: I will upload) / Como obtenerlo (enlace, o escriba: Subire los datos)'
    description: A link to the data itself, or 'I will upload'. Do not paste passwords or private links. / Un enlace a los datos, o 'Subire los datos'. No pegue contrasenas ni enlaces privados.
    placeholder: https://
  validations:
    required: true
- type: input
  id: c_producer
  attributes:
    label: Producer / Productor
    description: 'Who made it: agency, company, group or person. / Quien lo produjo.'
  validations:
    required: true
- type: input
  id: c_licence
  attributes:
    label: Licence / Licencia
    description: The licence it is under, e.g. CC-BY-4.0, CC0, ODbL; or 'unknown' or 'not open'. / La licencia, p. ej. CC-BY-4.0; o 'desconocida' o 'no abierta'.
    placeholder: CC-BY-4.0
  validations:
    required: true
- type: input
  id: c_where
  attributes:
    label: Where it covers (place and bounding box W,S,E,N) / Donde cubre (lugar y caja W,S,E,N)
    description: 'Place names and, if you can, a box in decimal degrees: west,south,east,north. / Lugares y, si puede, una caja en grados decimales.'
    placeholder: Pereira; -75.8,4.7,-75.6,4.9
  validations:
    required: true
- type: input
  id: c_when
  attributes:
    label: When (survey, acquisition or valid date, YYYY-MM-DD) / Cuando (fecha, AAAA-MM-DD)
    description: The date or the range of dates. / La fecha o el rango de fechas.
    placeholder: 2026-08-14 to 2026-08-20
  validations:
    required: true
- type: textarea
  id: p_mask
  attributes:
    label: Valid-area mask / Mascara de area valida
    description: Where the product is valid and where it is not (no data, water, cloud, outside the scene), and where the mask is. / Donde es valido y donde no, y donde esta la mascara.
  validations:
    required: true
- type: textarea
  id: p_method
  attributes:
    label: Method / Metodo
    description: 'How it was made: sensor, algorithm, version, reference. / Como se hizo: sensor, algoritmo, version, referencia.'
  validations:
    required: true
- type: textarea
  id: p_validation
  attributes:
    label: Validation or accuracy / Validacion o precision
    description: 'Optional: compared against what, with what result. / Opcional.'
  validations:
    required: false
- type: textarea
  id: c_limits
  attributes:
    label: Known limitations / Limitaciones conocidas
    description: Accuracy, gaps, bias, what it does not cover. 'None known' is an answer. / Precision, vacios, sesgos, lo que no cubre.
  validations:
    required: true
- type: checkboxes
  id: c_consent
  attributes:
    label: Consent to publish / Consentimiento
    description: Required. / Obligatorio.
    options:
    - label: I agree that the team may publish this description, and may use what I provide under the licence I state / Acepto que el equipo publique esta descripcion y use lo que aporto bajo la licencia que indico
      required: true
- type: input
  id: c_contact
  attributes:
    label: Contact (optional) / Contacto (opcional)
    description: 'Public: leave it empty if you prefer to be reached through this issue. / Es publico: dejelo vacio si prefiere que le respondamos aqui.'
  validations:
    required: false
- type: checkboxes
  id: ai_assisted
  attributes:
    label: AI assistance
    description: Using an AI assistant is welcome; we only ask you to say so.
    options:
    - label: An AI assistant helped write this
      required: false
- type: input
  id: assistant
  attributes:
    label: Which assistant
    description: 'Optional: e.g. Claude, ChatGPT, Gemini, Copilot, a local model.'
  validations:
    required: false
